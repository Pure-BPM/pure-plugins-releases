# Sveltia CMS configuration — edits manifest.json (the source of truth the Pure
# BPM Desktop app reads live) and uploads screenshots into this repo.
#
# The app fetches https://raw.githubusercontent.com/Pure-BPM/pure-plugins-releases/main/manifest.json
# on launch, so anything published here appears on the plugin detail pages with
# NO app update. Every save is a normal git commit — fully version-history'd and
# revertable.

backend:
  name: github
  repo: Pure-BPM/pure-plugins-releases
  branch: main
  # OAuth broker for GitHub sign-in (Sveltia auth worker on Cloudflare).
  base_url: https://sveltia-cms-auth.purebpm.workers.dev

# Screenshots are committed to /screenshots in this repo. Sveltia only allows a
# site-relative public_folder (not an absolute URL), so the field stores
# "/screenshots/<file>"; the desktop app resolves that against the repo's raw base
# when rendering.
media_folder: screenshots
public_folder: /screenshots

collections:
  - name: plugins
    label: Plugin pages
    files:
      - name: manifest
        label: All plugins
        file: manifest.json
        description: >-
          Edit each plugin's page here. Text changes and screenshot uploads go
          live on the app's plugin pages after Publish.
        fields:
          - { name: schema, widget: hidden, default: 1 }
          - {
              name: updated,
              label: 'Last updated (free text, e.g. 2026-09-05)',
              widget: string,
              required: false,
            }
          - name: plugins
            label: Plugins
            label_singular: Plugin
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {
                  name: id,
                  label: 'ID (do NOT change — the app matches on this)',
                  widget: string,
                }
              - { name: name, label: Name, widget: string }
              - {
                  name: blurb,
                  label: 'Tile blurb (short line on the right-column card)',
                  widget: string,
                }
              - { name: version, label: Version, widget: string, required: false }
              - {
                  name: comingSoon,
                  label: 'Coming soon? (hides the download button)',
                  widget: boolean,
                  default: false,
                }
              - name: assets
                label: Installer download URLs
                widget: object
                fields:
                  - { name: macos, label: macOS installer URL, widget: string, required: false }
                  - { name: windows, label: Windows installer URL, widget: string, required: false }
              - name: assetMeta
                label: Installer notes (shown under the download button)
                widget: object
                required: false
                fields:
                  - { name: macos, label: macOS note, widget: string, required: false }
                  - { name: windows, label: Windows note, widget: string, required: false }
              - name: detail
                label: Detail page content
                widget: object
                required: false
                fields:
                  - { name: tagline, label: 'Tagline (hero subtitle)', widget: string, required: false }
                  - {
                      name: engine,
                      label: 'Engine badge (e.g. Powered by Claude · Anthropic)',
                      widget: string,
                      required: false,
                    }
                  - { name: description, label: 'What it is (paragraph)', widget: text, required: false }
                  - {
                      name: highlights,
                      label: Highlights,
                      widget: list,
                      required: false,
                      hint: 'One bullet per entry.',
                    }
                  - {
                      name: requirements,
                      label: Requirements,
                      widget: list,
                      required: false,
                      hint: 'One requirement per entry.',
                    }
                  - name: screenshots
                    label: Screenshots
                    widget: list
                    required: false
                    hint: 'Drag-drop images; they appear in a gallery on the page.'
                    field: { name: image, label: Image, widget: image }

  - name: models
    label: AI Model pages
    files:
      - name: models
        label: All AI models
        file: models.json
        description: >-
          Edit each marketplace AI model's card here. The app fetches models.json
          on launch, so text/price/requirement changes go live with no app update.
          Price shown here is DISPLAY ONLY — the charge is enforced server-side
          from coinz_pricing. Asset URLs + SHA-256 must match the published files.
        fields:
          - { name: schema, widget: hidden, default: 1 }
          - {
              name: updated,
              label: 'Last updated (free text, e.g. 2026-09-06)',
              widget: string,
              required: false,
            }
          - name: models
            label: Models
            label_singular: Model
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {
                  name: id,
                  label: 'ID (do NOT change — the app matches on this)',
                  widget: string,
                }
              - { name: name, label: Name, widget: string }
              - { name: blurb, label: 'Card blurb (short line)', widget: string }
              - { name: description, label: 'Full description', widget: text }
              - {
                  name: highlights,
                  label: Highlights,
                  widget: list,
                  required: false,
                  hint: 'One bullet per entry.',
                }
              - { name: image, label: Card image, widget: image, required: false }
              - {
                  name: category,
                  label: Category,
                  widget: select,
                  options: ['generation', 'mastering', 'midi', 'voice'],
                }
              - {
                  name: priceCoinz,
                  label: 'Price in Coinz (DISPLAY ONLY — server enforces)',
                  widget: number,
                  value_type: int,
                }
              - {
                  name: downloadSizeBytes,
                  label: 'Download size in bytes',
                  widget: number,
                  value_type: int,
                }
              - { name: version, label: Version, widget: string }
              - {
                  name: hidden,
                  label: 'Hidden? (does not render as a card)',
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  name: comingSoon,
                  label: 'Coming soon?',
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - name: requirements
                label: Hardware requirements
                widget: object
                required: false
                fields:
                  - { name: minRamGB, label: 'Min RAM (GB)', widget: number, value_type: int, required: false }
                  - { name: appleSiliconOnly, label: 'Apple Silicon only?', widget: boolean, default: false, required: false }
                  - { name: minMacOS, label: 'Min macOS (e.g. 13.0)', widget: string, required: false }
              - name: assets
                label: Downloadable assets (weight files)
                widget: list
                summary: '{{fields.dest}}'
                fields:
                  - { name: url, label: Public asset URL, widget: string }
                  - { name: bytes, label: 'Expected size (bytes)', widget: number, value_type: int }
                  - { name: sha256, label: 'SHA-256 (lowercase hex)', widget: string }
                  - { name: dest, label: 'Destination path under models/<id>/', widget: string }
